# AION Surreal Boost v1.1 - Vulkan layer defaults (/etc/surreal-boost/layer.conf)
# Per-user override: ~/.config/surreal-boost/layer.conf
# Per-game override: SURREAL_SCALE / SURREAL_SHARPEN / SURREAL_AF / SURREAL_LOD_BIAS / SURREAL_FPS_CAP / SURREAL_LOG
#
# Spatial Render-Scale Upscaler (0.40 .. 1.00; 1.0 = off / native resolution).
#   0.77 = Ultra Quality (~1.7x pixel throughput)
#   0.67 = Quality       (~2.2x pixel throughput, e.g. 720p -> 1080p)
#   0.59 = Balanced      (~2.9x pixel throughput)
#   0.50 = Performance   (~4.0x pixel throughput, e.g. 540p -> 1080p)
scale = 1.0

# Upscale texture filter: linear (smooth subpixel interpolation) or nearest (crisp retro/pixel-art).
scale_filter = linear

# Contrast-Adaptive Sharpening (CAS) strength (0.0 .. 1.0).
# Automatically active when upscaling (scale < 1.0) at 0.55 unless overridden.
# Uncomment or set SURREAL_SHARPEN=0.55 to also apply native-resolution CAS at scale = 1.0!
# sharpen = 0.55

# Anisotropic filtering: raise trilinear texture samplers to N x (0 = leave game untouched, 2..16).
# Costs almost nothing on a GTX 1060 and makes ground/wall textures much sharper at a distance.
af = 8

# Texture LOD bias added to the game's own bias (-2.0 .. 2.0).
#   negative = sharper textures (can shimmer), positive = faster / softer. 0 = unchanged.
lod_bias = 0.0

# Frame limiter in FPS (0 = off). Use e.g. 60 for perfectly even frame pacing.
fps_cap = 0

# Write FPS / 1% low / frame-time stats to /tmp/surreal_layer.log every 2 s.
log = 0
